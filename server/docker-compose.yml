services:
  cloudvturb:
    build: .
    container_name: cloudvturb
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - BASE_DOMAIN=${BASE_DOMAIN:-}
      - PLAYER_DOMAIN=${PLAYER_DOMAIN:-}
      - DASH_DOMAIN=${DASH_DOMAIN:-}
      - APP_NAME=${APP_NAME:-CloudVTurb}
      - DATA_DIR=/app/data
      - VIDEOS_DIR=/app/videos
      - PUBLIC_DIR=/app/public
      - HLS_CONCURRENCY=${HLS_CONCURRENCY:-1}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_MEDIA_ZONE_ID=${CLOUDFLARE_MEDIA_ZONE_ID:-}
      - MEDIA_BASE_DOMAIN=${MEDIA_BASE_DOMAIN:-}
      - CDN_DOMAIN=${CDN_DOMAIN:-}
      - SCRIPTS_DOMAIN=${SCRIPTS_DOMAIN:-}
      - IMAGES_DOMAIN=${IMAGES_DOMAIN:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - FFMPEG_PRESET=${FFMPEG_PRESET:-veryfast}
    volumes:
      - /opt/apps/cloudvturb/data:/app/data
      - /opt/apps/cloudvturb/videos:/app/videos
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
